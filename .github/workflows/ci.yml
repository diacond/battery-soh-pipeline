name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 다운로드 (NASA PCoE)
        run: bash scripts/download_data.sh

      - name: 파이프라인 실행 (파싱 → 피처/라벨 생성)
        run: python src/pipeline/parse_mat.py

      - name: 모델 학습 및 Leave-One-Battery-Out 평가
        run: python src/model/train.py

      - name: RUL 모델 학습
        run: python -m src.model.train_rul

      - name: 테스트
        run: pytest -q --ignore=tests/test_external_calce.py --ignore=tests/test_experiment_mixed_training.py

  external-holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 다운로드 (NASA PCoE) 및 최종 모델 학습
        run: |
          bash scripts/download_data.sh
          python src/pipeline/parse_mat.py
          python src/model/train.py

      - name: 데이터 다운로드 (CALCE - 학습에 전혀 쓰이지 않은 외부 배터리)
        run: bash scripts/download_calce.sh

      - name: 외부 홀드아웃 피처 추출 및 평가
        run: |
          python -m src.pipeline.parse_calce
          python -m src.model.eval_external

      - name: 피처 정규화 가설 검증 실험 (편향을 줄일 수 있는지)
        run: python -m src.model.experiment_normalized_feature

      - name: NASA+CALCE 혼합 학습 실험 (데이터 누수 없는 leave-one-cell-out)
        run: python -m src.model.experiment_mixed_training

      - name: 외부 홀드아웃 회귀 테스트
        run: pytest -q tests/test_external_calce.py tests/test_experiment_normalized_feature.py tests/test_experiment_mixed_training.py